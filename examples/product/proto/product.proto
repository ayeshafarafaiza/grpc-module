syntax = "proto3";

package product;

service ProductService {
  rpc getProduct (ProductId) returns (Product) {}
  rpc getAllProduct (Empty) returns (ProductList) {}
  rpc createProduct (Product) returns (Product) {}
  rpc searchProducts (SearchRequest) returns (ProductList) {}
  rpc deleteProduct (ProductId) returns (DeleteResponse) {}
  rpc decreaseProductQuantity (DecreaseQuantityRequest) returns (DecreaseQuantityResponse) {}
}

message Empty {}

message Product {
  string id = 1;
  string name = 2;
  int32 quantity = 3;
  int32 price = 4;
}

message ProductList {
  repeated Product products = 1;
}

message ProductId {
  string id = 1;
}

message SearchRequest {
  string keyword = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message DecreaseQuantityRequest {
  string id = 1;
  int32 quantity = 2;
}

message DecreaseQuantityResponse {
  bool success = 1;
  string message = 2;
}
